[package]
name = "translator"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "translator"
path = "src/lib.rs"

[[bin]]
name = "bucket_samples"
path = "src/bin/bucket_samples.rs"
required-features = ["tts"]

[[bin]]
name = "bloat_probe"
path = "src/bin/bloat_probe.rs"
required-features = ["odt", "tts", "dictionary", "ppocr", "transliterate", "pdf"]

[[bin]]
name = "translate"
path = "src/bin/translate.rs"
required-features = ["translate-cli"]

[[bin]]
name = "surface_sim"
path = "src/bin/surface_sim.rs"
required-features = ["surface-sim"]

[[bin]]
name = "viz_pipeline"
path = "src/bin/viz_pipeline.rs"
required-features = ["viz"]

[[bin]]
name = "ppocr_bench"
path = "src/bin/ppocr_bench.rs"
required-features = ["ppocr"]

[[bin]]
name = "ink_bench"
path = "src/bin/ink_bench.rs"
required-features = ["ppocr"]

[features]
default = []
translate-cli = ["dep:toml"]
uniffi = ["dep:uniffi"]
dictionary = ["dep:tarkka"]
mucab = ["dep:mucab"]
tts = ["dep:piper-rs"]
transliterate = ["dep:icu_locale_core", "dep:icu_experimental", "dep:unicode-script"]
pdf = [
    "dep:mupdf",
    "dep:lopdf",
    "dep:ttf-parser",
    "dep:subsetter",
    "dep:rustybuzz",
    "dep:unicode-bidi",
    "dep:unicode-script",
]
odt = ["dep:zip"]
dom-translate = ["dep:markup5ever", "dep:markup5ever_rcdom"]
html = ["dom-translate", "dep:html5ever"]
epub = ["dom-translate", "dep:zip", "dep:xml5ever", "dep:ttf-parser"]
image-render = [
    "dep:ttf-parser",
    "dep:rustybuzz",
    "dep:unicode-bidi",
    "dep:unicode-script",
    "dep:unicode-linebreak",
    "dep:zeno",
]
pdf-image-translate = [
    "pdf",
    "image-render",
    "ppocr",
    "dep:image",
    "dep:fax",
]
doc-align = ["dep:ort", "dep:ndarray"]
ppocr = ["dep:mnn-sys", "dep:image", "dep:imageproc", "dep:ndarray", "dep:rayon"]
planar-tracker = ["dep:image", "dep:imageproc", "image-render", "dep:rayon"]
gpu = ["dep:glow", "planar-tracker"]
surface-sim = ["planar-tracker", "ppocr", "dep:minifb", "dep:ab_glyph", "dep:env_logger"]
viz = ["ppocr", "doc-align", "dep:ab_glyph", "dep:env_logger"]

[dependencies]
slimt-sys = { git = "https://github.com/DavidVentura/slimt-sys" }
cld2 = { git = "https://github.com/DavidVentura/rust-cld2" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", optional = true, default-features = false, features = ["parse"] }
uniffi = { version = "0.29", optional = true, default-features = false }
tarkka = { git = "https://github.com/DavidVentura/tarkka", optional = true }
mucab = { git = "https://github.com/DavidVentura/mucab", optional = true }
piper-rs = { git = "https://github.com/DavidVentura/piper-rs", optional = true, features = ["japanese", "fst-normalization", "mnn"] }
# mnn-sys = { path = "../mnn-sys", optional = true }
mnn-sys = { git = "https://github.com/DavidVentura/mnn-sys", optional = true }
icu_experimental = { version = "0.4", features = ["compiled_data"], optional = true }
icu_locale_core = { version = "2.2", optional = true }
lopdf = { version = "0.40", optional = true, default-features = false }
ttf-parser = { version = "0.25", optional = true, default-features = false, features = ["std", "opentype-layout"] }
subsetter = { version = "0.2", optional = true, default-features = false }
rustybuzz = { version = "0.20", optional = true, default-features = false, features = ["std"] }
unicode-bidi = { version = "0.3", optional = true, default-features = false, features = ["std", "hardcoded-data"] }
unicode-script = { version = "0.5", optional = true, default-features = false }
unicode-linebreak = { version = "0.1", optional = true }
zeno = { version = "0.3", optional = true, default-features = false, features = ["std", "eval"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
fax = { version = "0.2", optional = true }
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = ["load-dynamic"] }
ndarray = { version = "0.16", optional = true }
imageproc = { version = "0.25", optional = true, default-features = false }
rayon = { version = "1", optional = true }
glow = { version = "0.17", optional = true, default-features = false }
log = "0.4"
minifb = { version = "0.27", optional = true }
ab_glyph = { version = "0.2", optional = true }
env_logger = { version = "0.11", optional = true }

zip = { version = "2.4.2", optional = true, default-features = false, features = ["deflate"] }
html5ever = { version = "0.38", optional = true }
markup5ever = { version = "0.38", optional = true }
markup5ever_rcdom = { version = "0.38", optional = true }
xml5ever = { version = "0.38", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ab_glyph = "0.2"
env_logger = "0.11"
khronos-egl = { version = "6", features = ["dynamic"] }

[target.'cfg(target_os = "android")'.dependencies]
mupdf = { git = "https://github.com/DavidVentura/mupdf-rs", optional = true, default-features = false, features = [] }

[target.'cfg(all(target_arch = "aarch64", any(target_os = "linux", target_os = "android")))'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
mupdf = { git = "https://github.com/DavidVentura/mupdf-rs", optional = true, default-features = false, features = ["system-fonts"] }

[[test]]
name = "gpu_compositor"
path = "tests/gpu_compositor.rs"
required-features = ["gpu"]

[[test]]
name = "screen_monitor_gpu"
path = "tests/screen_monitor_gpu.rs"
required-features = ["gpu"]

[[test]]
name = "pdf_smoke"
path = "tests/pdf_smoke.rs"
required-features = ["pdf"]

[[test]]
name = "pdf_image_smoke"
path = "tests/pdf_image_smoke.rs"
required-features = ["pdf-image-translate"]

[[test]]
name = "odt_smoke"
path = "tests/odt_smoke.rs"
required-features = ["odt"]

[[test]]
name = "doc_align_refine_visual"
path = "tests/doc_align/refine_visual.rs"
required-features = ["doc-align"]

[[test]]
name = "ppocr_tilt_dump"
path = "tests/ppocr_tilt_dump.rs"
required-features = ["ppocr"]

[[test]]
name = "ppocr_color_matting"
path = "tests/ppocr_color_matting.rs"
required-features = ["ppocr"]

[[test]]
name = "planar_tracker_synthetic"
path = "tests/planar_tracker_synthetic.rs"
required-features = ["planar-tracker"]

[[test]]
name = "planar_engine_lifecycle"
path = "tests/planar_engine_lifecycle.rs"
required-features = ["planar-tracker"]

[[test]]
name = "live_video_overlay_smoke"
path = "tests/live_video_overlay_smoke.rs"
required-features = ["ppocr", "planar-tracker"]

# [patch."https://github.com/DavidVentura/piper-rs"]
# piper-rs = { path = "../piper-rs" }

# [patch."https://github.com/DavidVentura/mupdf-rs"]
# piper-rs = { path = "../mupdf-rs" }

[[test]]
name = "ppocr_textline_orientation"
path = "tests/ppocr_textline_orientation.rs"
required-features = ["ppocr", "planar-tracker"]

[[test]]
name = "ppocr_single_frame_overlay"
path = "tests/ppocr_single_frame_overlay.rs"
required-features = ["ppocr", "planar-tracker", "image-render"]
