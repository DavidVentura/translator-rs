[package]
name = "translator"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "translator"
path = "src/lib.rs"

[[bin]]
name = "bucket_samples"
path = "src/bin/bucket_samples.rs"
required-features = ["tts"]

[[bin]]
name = "bloat_probe"
path = "src/bin/bloat_probe.rs"
required-features = ["odt", "tts", "dictionary", "tesseract", "transliterate", "pdf"]

[[bin]]
name = "translate"
path = "src/bin/translate.rs"
required-features = ["translate-cli"]

[features]
default = []
translate-cli = ["dep:toml"]
uniffi = ["dep:uniffi"]
dictionary = ["dep:tarkka"]
mucab = ["dep:mucab"]
tesseract = ["dep:tesseract"]
tts = ["dep:piper-rs"]
transliterate = ["dep:icu_locale_core", "dep:icu_experimental"]
pdf = ["dep:mupdf", "dep:lopdf", "dep:ttf-parser", "dep:subsetter"]
odt = ["dep:zip"]
html = ["dep:html5ever", "dep:markup5ever_rcdom"]
image-render = [
    "dep:ttf-parser",
    "dep:rustybuzz",
    "dep:unicode-bidi",
    "dep:unicode-script",
    "dep:unicode-linebreak",
    "dep:zeno",
]
pdf-image-translate = [
    "pdf",
    "image-render",
    "tesseract",
    "dep:image",
    "dep:fax",
]
doc-align = ["dep:ort", "dep:ndarray"]
ppocr = ["dep:mnn-sys", "dep:image", "dep:imageproc", "dep:ndarray", "dep:rayon"]

[dependencies]
slimt-sys = { git = "https://github.com/DavidVentura/slimt-sys" }
cld2 = { git = "https://github.com/DavidVentura/rust-cld2" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", optional = true, default-features = false, features = ["parse"] }
uniffi = { version = "0.29", optional = true, default-features = false }
tarkka = { git = "https://github.com/DavidVentura/tarkka", optional = true }
tesseract = { git = "https://github.com/DavidVentura/tesseract-rs", optional = true }
mucab = { git = "https://github.com/DavidVentura/mucab", optional = true }
piper-rs = { git = "https://github.com/DavidVentura/piper-rs", optional = true, features = ["japanese", "fst-normalization"] }
# mnn-sys = { path = "../mnn-sys", optional = true }
mnn-sys = { git = "https://github.com/DavidVentura/mnn-sys", optional = true }
icu_experimental = { version = "0.4", features = ["compiled_data"], optional = true }
icu_locale_core = { version = "2.2", optional = true }
lopdf = { version = "0.40", optional = true, default-features = false }
ttf-parser = { version = "0.25", optional = true, default-features = false, features = ["std", "opentype-layout"] }
subsetter = { version = "0.2", optional = true, default-features = false }
rustybuzz = { version = "0.20", optional = true, default-features = false, features = ["std"] }
unicode-bidi = { version = "0.3", optional = true, default-features = false, features = ["std", "hardcoded-data"] }
unicode-script = { version = "0.5", optional = true, default-features = false }
unicode-linebreak = { version = "0.1", optional = true }
zeno = { version = "0.3", optional = true, default-features = false, features = ["std", "eval"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
fax = { version = "0.2", optional = true }
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = ["load-dynamic"] }
ndarray = { version = "0.16", optional = true }
imageproc = { version = "0.25", optional = true, default-features = false }
rayon = { version = "1", optional = true }
log = "0.4"

zip = { version = "2.4.2", optional = true, default-features = false, features = ["deflate"] }
html5ever = { version = "0.38", optional = true }
markup5ever_rcdom = { version = "0.38", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ab_glyph = "0.2"
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
mupdf = { git = "https://github.com/DavidVentura/mupdf-rs", optional = true, default-features = false, features = [] }

[target.'cfg(not(target_os = "android"))'.dependencies]
mupdf = { git = "https://github.com/DavidVentura/mupdf-rs", optional = true, default-features = false, features = ["system-fonts"] }

[[test]]
name = "overpaint_visual"
path = "tests/overpaint_visual.rs"
required-features = ["tesseract", "image-render"]

[[test]]
name = "pdf_smoke"
path = "tests/pdf_smoke.rs"
required-features = ["pdf"]

[[test]]
name = "pdf_image_smoke"
path = "tests/pdf_image_smoke.rs"
required-features = ["pdf-image-translate"]

[[test]]
name = "odt_smoke"
path = "tests/odt_smoke.rs"
required-features = ["odt"]

[[test]]
name = "doc_align_refine_visual"
path = "tests/doc_align/refine_visual.rs"
required-features = ["doc-align"]

